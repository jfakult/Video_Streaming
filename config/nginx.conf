#user http;
worker_processes  2;

error_log  /var/log/nginx/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    map $http_upgrade $connection_upgrade{
            default upgrade;
            '' close;
    }

    server {
        listen       80;
        server_name  localhost 192.168.5.1 wild.stream 192.168.1.101 192.168.1.148;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        root /usr/share/nginx/html/;

	# See backend/server.py
        location /cam/ {
            proxy_pass http://127.0.0.1:8889$uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

	    proxy_set_header X-Debug-Path $request_uri;

	    # --- CORS headers ---
	    #add_header 'Access-Control-Allow-Origin' '*' always;
	    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, DELETE' always;
	    add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, If-Match' always;

    	    # Respond to preflight OPTIONS requests directly
	    if ($request_method = OPTIONS) {
		add_header 'Access-Control-Allow-Origin' '*' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, DELETE' always;
		add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, If-Match' always;
	        add_header 'Access-Control-Max-Age' 1728000;
	        add_header 'Content-Length' 0;
	        add_header 'Content-Type' 'text/plain; charset=utf-8';
	        return 204;
	    }
        }

        location / {
            # add_header Cross-Origin-Opener-Policy same-origin always;
            # add_header Cross-Origin-Embedder-Policy require-corp always;
	    root /usr/share/nginx/html;
        }

	location /gen_204 {
		return 204;
	}
	location /generate_204 {
		return 204;
	}
    }

    server {
        listen 80;
        server_name _;   #connectivitycheck.gstatic.com www.apple.com clients3.google.com;

        location / {
                return 204; # return 302 http://wild.stream;
        }
    }
}
